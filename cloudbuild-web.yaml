steps:
  # Сборка Docker образа для Web UI
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-f'
      - 'Dockerfile.web'
      - '-t'
      - 'gcr.io/$PROJECT_ID/tables-and-columns-description-web:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/tables-and-columns-description-web:latest'
      - '.'

  # Отправка образа в Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-tagged'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/tables-and-columns-description-web:$SHORT_SHA'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/tables-and-columns-description-web:latest'
    waitFor: ['build-image']

  # Развертывание Cloud Run Service (Web UI)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tables-and-columns-description-web'
      - '--image=gcr.io/$PROJECT_ID/tables-and-columns-description-web:$SHORT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--port=8081'
      - '--set-secrets=OPENAI_API_KEY=analytics_table_desc_ai_creator:latest'
      - '--set-env-vars=GOOGLE_CLIENT_ID=19297483087-gvbvq7qfidl8ppr2orciemff6l1nfrm5.apps.googleusercontent.com,GOOGLE_CLIENT_SECRET=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,REDIRECT_URI=https://tables-and-columns-description-web-gccuajx7eq-ew.a.run.app/auth/callback,SECRET_KEY=qxkHSR61_ugaJu1PfAwzVsuNUA_XiAn1cHXzdwEIkuA'
      - '--project=$PROJECT_ID'
    waitFor: ['push-tagged']

images:
  - 'gcr.io/$PROJECT_ID/tables-and-columns-description-web:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/tables-and-columns-description-web:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
